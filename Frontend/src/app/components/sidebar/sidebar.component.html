<aside class="sidebar">
  <div class="top-logo" (click)="selectNav('van')" title="Fleet Dashboard">
    <div class="logo-grid">
      <span></span><span></span><span></span><span></span>
    </div>
  </div>

  <nav class="nav-icons">
    <button [class.active]="activeNav === 'messages'" (click)="selectNav('messages')" title="Messages / Inbox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
    </button>

    <button [class.active]="activeNav === 'route'" (click)="selectNav('route')" title="Routes / Map">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"></path><circle cx="12" cy="9" r="2.5"></circle></svg>
    </button>

    <button [class.active]="activeNav === 'van'" (click)="selectNav('van')" title="Fleet Vehicles">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>
    </button>

    <button [class.active]="activeNav === 'home'" (click)="selectNav('home')" title="Overview Dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
    </button>

    <button [class.active]="activeNav === 'docs'" (click)="selectNav('docs')" title="Documents">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
    </button>

    <button [class.active]="activeNav === 'analytics'" (click)="selectNav('analytics')" title="Analytics">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
    </button>

    <button [class.active]="activeNav === 'alerts'" (click)="selectNav('alerts')" title="System Alerts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
    </button>
  </nav>

  <div class="bottom-user" (click)="selectNav('profile')" title="Profile / Settings">
    <div class="avatar-small" [class.active-avatar]="activeNav === 'profile'">
      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" alt="User Avatar">
    </div>
  </div>
</aside>
