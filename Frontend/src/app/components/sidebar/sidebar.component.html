<aside class="sidebar">
  <div class="top-logo" (click)="selectNav('van')" title="Panel de Gestión de Flota">
    <div class="logo-grid">
      <span></span><span></span><span></span><span></span>
    </div>
  </div>

  <nav class="nav-icons">
    <button [class.active]="activeNav === 'messages'" (click)="selectNav('messages')" title="Mensajes e Incidencias">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
        <polyline points="22,6 12,13 2,6"></polyline>
      </svg>
    </button>

    <button [class.active]="activeNav === 'route'" (click)="selectNav('route')" title="Mapa y Rutas GPS">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="10" r="3"></circle>
        <path d="M12 2a8 8 0 0 0-8 8c0 5.25 8 12 8 12s8-6.75 8-12a8 8 0 0 0-8-8z"></path>
      </svg>
    </button>

    <button [class.active]="activeNav === 'van'" (click)="selectNav('van')" title="Vehículos de Flota" class="van-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="1" y="3" width="15" height="13"></rect>
        <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon>
        <circle cx="5.5" cy="18.5" r="2.5"></circle>
        <circle cx="18.5" cy="18.5" r="2.5"></circle>
      </svg>
    </button>

    <button [class.active]="activeNav === 'home'" (click)="selectNav('home')" title="Vista General">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
    </button>

    <button [class.active]="activeNav === 'docs'" (click)="selectNav('docs')" title="Documentos y Pólizas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="4" y="4" width="16" height="16" rx="2"></rect>
        <rect x="2" y="8" width="16" height="12" rx="2"></rect>
      </svg>
    </button>

    <button [class.active]="activeNav === 'analytics'" (click)="selectNav('analytics')" title="Analítica y Rendimiento">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="20" x2="18" y2="10"></line>
        <line x1="12" y1="20" x2="12" y2="4"></line>
        <line x1="6" y1="20" x2="6" y2="14"></line>
      </svg>
    </button>

    <button [class.active]="activeNav === 'alerts'" (click)="selectNav('alerts')" title="Alertas y Mantenimiento" class="alert-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      <span class="red-alert-dot"></span>
    </button>
  </nav>

  <div class="bottom-user" (click)="selectNav('profile')" title="Perfil de Usuario">
    <div class="avatar-small" [class.active-avatar]="activeNav === 'profile'">
      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" alt="Usuario">
    </div>
  </div>
</aside>
