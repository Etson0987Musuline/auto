<div class="modal-overlay" (click)="onClose()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div class="title-with-icon">
        <span class="icon">🚚</span>
        <div>
          <h3>Agregar Nuevo Vehículo / Conductor</h3>
          <p class="subtitle">Registra la unidad de transporte en la base de datos PostgreSQL</p>
        </div>
      </div>
      <button class="close-btn" (click)="onClose()" title="Cerrar">✕</button>
    </div>

    <form [formGroup]="vehicleForm" (ngSubmit)="onSubmit()" class="modal-form">
      <!-- Nombre del Conductor -->
      <div class="form-group">
        <label>Nombre del Conductor <span class="required">*</span></label>
        <input 
          type="text" 
          formControlName="driverName" 
          placeholder="ej. Alex Morales Mendoza"
          [class.invalid]="submitted && f['driverName'].errors">
        <span class="error-text" *ngIf="submitted && f['driverName'].errors">
          El nombre del conductor es obligatorio.
        </span>
      </div>

      <!-- Modelo del Vehículo -->
      <div class="form-group">
        <label>Modelo / Marca del Vehículo <span class="required">*</span></label>
        <input 
          type="text" 
          formControlName="vehicleModel" 
          placeholder="ej. Mercedes-Benz Sprinter 314"
          [class.invalid]="submitted && f['vehicleModel'].errors">
        <span class="error-text" *ngIf="submitted && f['vehicleModel'].errors">
          El modelo del vehículo es obligatorio.
        </span>
      </div>

      <!-- Fila: Categoría y Estado Operativo -->
      <div class="form-row">
        <div class="form-group">
          <label>Categoría de Flota</label>
          <select formControlName="category">
            <option value="FAVORITOS">⭐ FAVORITOS</option>
            <option value="CAMIONES">🚚 CAMIONES</option>
            <option value="FURGONETAS">🚐 FURGONETAS</option>
          </select>
        </div>

        <div class="form-group">
          <label>Estado Operativo</label>
          <select formControlName="status">
            <option value="EN CAMINO">🔵 EN CAMINO</option>
            <option value="CARGANDO">🟢 CARGANDO</option>
            <option value="ESPERANDO">🟡 ESPERANDO</option>
            <option value="DESCARGANDO">🟣 DESCARGANDO</option>
          </select>
        </div>
      </div>

      <!-- Fila: Placa y Capacidad de Carga -->
      <div class="form-row">
        <div class="form-group">
          <label>Placa / Matrícula <span class="required">*</span></label>
          <input 
            type="text" 
            formControlName="licensePlate" 
            placeholder="ej. 6TRJ244"
            [class.invalid]="submitted && f['licensePlate'].errors">
          <span class="error-text" *ngIf="submitted && f['licensePlate'].errors">
            Ingrese una placa válida.
          </span>
        </div>

        <div class="form-group">
          <label>Capacidad de Carga (Payload)</label>
          <input type="text" formControlName="payload" placeholder="ej. 2,885 lbs (1,308 kg)">
        </div>
      </div>

      <!-- Fila: Dimensiones Físicas -->
      <div class="form-row three-cols">
        <div class="form-group">
          <label>Volumen</label>
          <input type="text" formControlName="loadVolume" placeholder="0.55 in³">
        </div>
        <div class="form-group">
          <label>Largo</label>
          <input type="text" formControlName="loadLength" placeholder="117 in">
        </div>
        <div class="form-group">
          <label>Ancho</label>
          <input type="text" formControlName="loadWidth" placeholder="67 in">
        </div>
      </div>

      <!-- Botones de Acción -->
      <div class="modal-actions">
        <button type="button" class="cancel-btn" (click)="onClose()">Cancelar</button>
        <button type="submit" class="submit-btn">Guardar en Base de Datos</button>
      </div>
    </form>
  </div>
</div>
