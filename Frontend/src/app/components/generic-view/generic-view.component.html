<div class="generic-card">
  <div class="view-icon">{{ icon }}</div>
  <h2>{{ title }}</h2>
  <p>{{ description }}</p>

  <div class="sample-grid">
    <div class="metric-box">
      <span class="m-val">98.4%</span>
      <span class="m-lbl">Tasa Operativa</span>
    </div>
    <div class="metric-box">
      <span class="m-val">14 Unidades</span>
      <span class="m-lbl">Monitoreadas en Vivo</span>
    </div>
    <div class="metric-box">
      <span class="m-val">PostgreSQL</span>
      <span class="m-lbl">Sincronización DB</span>
    </div>
  </div>
</div>
