<div class="generic-card">
  <div class="view-icon">{{ icon }}</div>
  <h2>{{ title }}</h2>
  <p>{{ description }}</p>

  <div class="sample-grid">
    <div class="metric-box">
      <span class="m-val">98.4%</span>
      <span class="m-lbl">Operational Rate</span>
    </div>
    <div class="metric-box">
      <span class="m-val">14 Active</span>
      <span class="m-lbl">Monitored Units</span>
    </div>
    <div class="metric-box">
      <span class="m-val">PostgreSQL</span>
      <span class="m-lbl">Live Sync</span>
    </div>
  </div>
</div>
