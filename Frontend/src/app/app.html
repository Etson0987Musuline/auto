<div class="app-layout">
  <!-- 1. Left Dark Sidebar -->
  <app-sidebar [activeNav]="activeNav" (navChange)="onNavChange($event)"></app-sidebar>

  <!-- 2. Fleet Drivers Sidebar (Visible in 'van' view) -->
  <app-vehicle-list
    *ngIf="activeNav === 'van'"
    [vehicles]="vehicles"
    [selectedVehicle]="selectedVehicle"
    (selectVehicle)="onSelectVehicle($event)"
    (openAddModal)="openAddModal()">
  </app-vehicle-list>

  <!-- 3. Main Workspace Views -->
  <main class="main-content">
    <!-- VIEW 1: Fleet Vehicles Dashboard (Default 'van') -->
    <div class="content-wrapper" *ngIf="activeNav === 'van'">
      <app-vehicle-header-card
        [vehicle]="selectedVehicle"
        (editVehicle)="openEditModal()"
        (deleteVehicle)="onDeleteVehicle($event)">
      </app-vehicle-header-card>

      <div class="dashboard-grid">
        <div class="card routes-card">
          <app-routes-card 
            [routes]="routes"
            (assignNewRoute)="onAssignNewRoute($event)">
          </app-routes-card>
        </div>

        <div class="card stats-card">
          <app-driver-stats [stats]="driverStats"></app-driver-stats>
        </div>
      </div>
    </div>

    <!-- VIEW 2: Messages / Driver Inbox ('messages') -->
    <div class="view-container" *ngIf="activeNav === 'messages'">
      <app-messages-view></app-messages-view>
    </div>

    <!-- VIEW 3: Routes Map ('route') -->
    <div class="view-container" *ngIf="activeNav === 'route'">
      <app-generic-view
        title="Mapa Interactivo y Seguimiento GPS"
        description="Monitoreo satelital en tiempo real de rutas y despacho de envíos."
        icon="📍">
      </app-generic-view>
    </div>

    <!-- VIEW 4: Overview Dashboard ('home') -->
    <div class="view-container" *ngIf="activeNav === 'home'">
      <app-generic-view
        title="Panel de Control y Resumen General"
        description="Métricas de alto nivel, estado global de la flota y resumen operativo."
        icon="🏠">
      </app-generic-view>
    </div>

    <!-- VIEW 5: Documents ('docs') -->
    <div class="view-container" *ngIf="activeNav === 'docs'">
      <app-generic-view
        title="Gestión de Documentos y Cumplimiento"
        description="Pólizas SOAT, tarjetas de propiedad, revisiones técnicas y licencias de conducir."
        icon="📄">
      </app-generic-view>
    </div>

    <!-- VIEW 6: Analytics ('analytics') -->
    <div class="view-container" *ngIf="activeNav === 'analytics'">
      <app-generic-view
        title="Analítica de Rendimiento de Flota"
        description="Eficiencia de combustible, tiempos de entrega y reportes de mantenimiento."
        icon="📊">
      </app-generic-view>
    </div>

    <!-- VIEW 7: Alerts ('alerts') -->
    <div class="view-container" *ngIf="activeNav === 'alerts'">
      <app-generic-view
        title="Alertas del Sistema y Mantenimiento"
        description="Notificaciones de retraso, alertas preventivas y programación de servicios técnicos."
        icon="🔔">
      </app-generic-view>
    </div>

    <!-- VIEW 8: Profile / Settings ('profile') -->
    <div class="view-container" *ngIf="activeNav === 'profile'">
      <app-generic-view
        title="Perfil de Usuario y Configuración"
        description="Ajustes de cuenta, credenciales de PostgreSQL y configuración general del sistema."
        icon="👤">
      </app-generic-view>
    </div>
  </main>

  <!-- Modals -->
  <app-add-vehicle-modal
    *ngIf="isAddModalOpen"
    (closeModal)="closeModals()"
    (saveVehicle)="onSaveVehicle($event)">
  </app-add-vehicle-modal>

  <app-edit-vehicle-modal
    *ngIf="isEditModalOpen && selectedVehicle"
    [vehicle]="selectedVehicle"
    (closeModal)="closeModals()"
    (updateVehicle)="onUpdateVehicle($event)">
  </app-edit-vehicle-modal>

  <!-- Modal de Confirmación de Eliminación -->
  <div class="delete-modal-overlay" *ngIf="isDeleteModalOpen && vehicleToDelete" (click)="cancelDelete()">
    <div class="delete-modal-card" (click)="$event.stopPropagation()">
      <div class="delete-modal-icon">
        <span>🗑️</span>
      </div>
      <h3>¿Eliminar de la Base de Datos?</h3>
      <p class="delete-modal-desc">
        ¿Está seguro de que desea eliminar la unidad <strong>{{ vehicleToDelete.vehicleModel }}</strong> de <strong>{{ vehicleToDelete.driverName }}</strong> (Placa: {{ vehicleToDelete.licensePlate || 'N/A' }}) de la base de datos PostgreSQL?
      </p>
      <div class="delete-modal-actions">
        <button type="button" class="btn-cancel" (click)="cancelDelete()">Cancelar</button>
        <button type="button" class="btn-delete" (click)="confirmDeleteVehicle()">Sí, Eliminar de la Base de Datos</button>
      </div>
    </div>
  </div>
</div>
